<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ورود | کافی‌نت NetAviz</title>
  <link rel="stylesheet" href="Assets/css/style.css">
     <link rel="stylesheet" href="Assets/css/color.css"> 
  
  <style>
    :root{
      --primary:#0d6efd;
      --card:#fff;
      --bg:#f7f7f7;
    }
    @font-face {
      font-family: "Morabba-Medium";
      src: url('Assets/Fonts/Morabba-Medium.ttf'), format('truetype');
    }
    body{font-family:"Morabba-Medium",sans-serif;direction:rtl;background:var(--bg);margin:0;padding:0;}
    header{background:var(--primary);color:#fff;padding:18px;text-align:center;}
    header img{height:70px;display:block;margin:0 auto 8px;}
    .container{max-width:420px;margin:30px auto;padding:20px;}
    .card{background:var(--card);border-radius:10px;padding:22px;box-shadow:0 4px 18px rgba(0,0,0,0.08);}
    label{display:block;margin-bottom:6px;font-weight:600;color:#333;}
    input[type="text"],input[type="email"],input[type="password"],input[type="tel"]{
      width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;margin-bottom:12px;font-size:14px;
    }
    .actions{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
    .primary-btn{background:var(--primary);color:#fff;padding:10px 14px;border:none;border-radius:6px;cursor:pointer;}
    a.link{color:var(--primary);text-decoration:none;font-size:14px;}
    .small{font-size:13px;color:#666;margin-top:10px;}
  </style>
</head>
<body>
  <header>
    <img src="Assets/Image/image.png" alt="لوگوی NetAviz">
    <h1>کافی‌نت NetAviz</h1>
    <p style="margin:6px 0 0;color:#e6f0ff;font-size:14px">اولین ارائه‌دهنده خدمات آنلاین و غیرحضوری در شهر جدید بهارستان</p>
  </header>

  <main class="container">
    <div class="card" role="region" aria-labelledby="login-title">
      <h2 id="login-title">ورود</h2>

      <!-- توجه: action باید به endpoint واقعی سرور اشاره کند -->
      <form action="/api/login" method="POST" novalidate>
        <label for="username">ایمیل یا شماره تلفن</label>
        <input id="username" name="username" type="text" placeholder="example@domain.com یا 0912..." autocomplete="username" required>

        <label for="password">رمز عبور</label>
        <input id="password" name="password" type="password" minlength="8" autocomplete="current-password" placeholder="رمز عبور" required>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
          <label style="font-weight:normal;"><input type="checkbox" name="remember"> مرا به خاطر بسپار</label>
          <a class="link" href="forgot-password.html">رمز عبور را فراموش کرده‌اید؟</a>
        </div>

        <div class="actions" style="margin-top:16px;">
          <button type="submit" class="primary-btn">ورود</button>
          <a class="link" href="signup.html">ساخت حساب جدید</a>
        </div>

        
      </form>
    </div>
  </main>
</body>
</html>
