<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازیابی رمز عبور | کافی‌نت NetAviz</title>
  <link rel="stylesheet" href="Assets/css/style.css">
     <link rel="stylesheet" href="Assets/css/color.css"> 
  <style>
    @font-face {
      font-family: "Morabba-Medium";
      src: url('Assets/Fonts/Morabba-Medium.ttf'), format('truetype');
    }

    body {
      font-family: "Morabba", sans-serif;
      direction: rtl;
      background-color: #f6f7fb;
      text-align: center;
    }

    header {
      background-color: #0d6efd;
      color: #fff;
      padding: 20px;
    }

    header img {
      width: 90px;
      height: auto;
    }

    form {
      background-color: #fff;
      width: 320px;
      margin: 60px auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      text-align: right;
    }

    label {
      display: block;
      font-size: 14px;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #0d6efd;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
      width: 100%;
      cursor: pointer;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 10px;
      color: #0d6efd;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <img src="Assets/Image/image.png" alt="لوگوی کافی‌نت NetAviz">
    <h2>کافی‌نت NetAviz</h2>
  </header>

  <form>
    <label for="new-pass">رمز عبور جدید:</label>
    <input type="password" id="new-pass" name="new-pass" required>

    <label for="confirm-pass">تکرار رمز عبور جدید:</label>
    <input type="password" id="confirm-pass" name="confirm-pass" required>

    <button type="submit">ذخیره رمز جدید</button>
    <a href="login.html">بازگشت به صفحه ورود</a>
  </form>
</body>
</html>
