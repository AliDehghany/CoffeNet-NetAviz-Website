<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مرحله ۲: آپلود فایل</title>
<style>
@font-face {
    font-family: 'Morabba-Medium';
    src: url(Morabba-Medium.ttf) format('truetype'); /* مسیر فایل فونت نسبت به HTML */
    font-weight: normal;
    font-style: normal;
}

body { font-family: 'Morabba-Medium', Tahoma, sans-serif; margin:0; padding:0; direction: rtl; background:#f9f9f9; }
header { background:#0056b3; color:white; padding:15px 20px; display:flex; align-items:center; justify-content:space-between;}
header img { height:50px; }
nav a { color:white; text-decoration:none; margin:0 15px; font-weight:bold; }
nav a:hover { text-decoration:underline; }
h2 { text-align:center; margin-top:30px; color:#333; }
.step { max-width:600px; margin:20px auto; padding:20px; background:#fff; border-radius:12px; box-shadow:0 0 15px rgba(0,0,0,0.1);}
form { display:flex; flex-direction:column; gap:15px; }
input, select, textarea { padding:10px; border-radius:8px; border:1px solid #ccc; font-size:16px; }
textarea { resize: vertical; }
.upload-btn { background:#ff9800; color:white; border:none; padding:12px; border-radius:8px; cursor:pointer; font-weight:bold; width:200px; text-align:center; margin:auto; opacity:0.6; pointer-events:none; }
.upload-btn.active { opacity:1; pointer-events:auto; }
</style>
</head>
<body>

<header>
  <img src="image.png" alt="لوگو">
  <nav>
    <a href="index.html">خانه</a>
    <a href="step1.html">ثبت سفارش خدمات</a>
    <a href="contact.html">تماس با ما</a>
    <a href="about.html" class="active">درباره ما</a>
  </nav>
</header>

<style>
header {
  background:#0056b3;
  color:white;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:center; /* منو وسط */
  gap:50px; /* فاصله بین لوگو و لینک‌ها */
}

body {
  font-family: "Morabba-Medium", Tahoma, sans-serif;
  margin:0;
  padding:0;
  direction: rtl;
}

header {
  display: flex;
  align-items: center;
  justify-content: center; /* ابتدا همه وسط */
  position: relative;
  padding: 15px 40px;
  background:#007bff;
}

/* منو وسط هدر */
.center-nav {
  display: flex;
  gap: 40px; /* فاصله بین لینک‌ها */
  position: absolute;
  left: 50%;
  transform: translateX(-50%); /* وسط هدر */
}

.center-nav a {
  color:white;
  text-decoration:none;
  font-weight:bold;
  padding:5px 0;
}

.center-nav a:hover {
  text-decoration: underline;
}

/* لوگو سمت راست */
header .logo {
  height: 50px;
  margin-left: auto; /* برای قرار گرفتن سمت راست */
}
</style>

<h2>مرحله ۲: آپلود فایل یا وارد کردن توضیحات</h2>
<div class="step">
<form id="formStep2">
<input type="text" id="name" placeholder="نام و نام خانوادگی" required>
<input type="tel" id="phone" placeholder="شماره تماس" required>
<select id="serviceSelect" required>
<option value="">انتخاب نوع خدمت</option>
<option>چاپ و پرینت</option>
<option>اسکن</option>
<option>تایپ</option>
<option>ترجمه</option>
<option>ثبت‌نام اینترنتی</option>
</select>
<input type="file" id="fileInput">
<textarea id="details" placeholder="توضیحات اضافی"></textarea>
<button type="submit" class="upload-btn" id="nextBtn">مرحله بعد</button>
</form>
</div>

<script>
const form = document.getElementById('formStep2');
const nextBtn = document.getElementById('nextBtn');

// پر کردن فرم با داده‌های ذخیره شده
document.getElementById('name').value = localStorage.getItem('name') || '';
document.getElementById('phone').value = localStorage.getItem('phone') || '';
document.getElementById('serviceSelect').value = localStorage.getItem('serviceType') || '';
document.getElementById('details').value = localStorage.getItem('details') || '';

function checkForm() {
    if(document.getElementById('name').value && document.getElementById('phone').value && document.getElementById('serviceSelect').value) {
        nextBtn.classList.add('active');
    } else {
        nextBtn.classList.remove('active');
    }
}

['name','phone','serviceSelect','details'].forEach(id => {
    document.getElementById(id).addEventListener('input', checkForm);
});

checkForm();

form.addEventListener('submit', e => {
    e.preventDefault();
    localStorage.setItem('name', document.getElementById('name').value);
    localStorage.setItem('phone', document.getElementById('phone').value);
    localStorage.setItem('serviceType', document.getElementById('serviceSelect').value);
    localStorage.setItem('details', document.getElementById('details').value);
    window.location.href = 'step3.html';
});
</script>

</body>
</html>
