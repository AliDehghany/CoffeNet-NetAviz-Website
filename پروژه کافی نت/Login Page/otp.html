<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کد تأیید | کافی‌نت NetAviz</title>
  <style>
    @font-face {
      font-family: "Morabba";
      src: url("../Font/Morabba-Medium.ttf") format("truetype");
    }

    body {
      font-family: "Morabba", sans-serif;
      direction: rtl;
      background-color: #f6f7fb;
      text-align: center;
    }

    header {
      background-color: #0d6efd;
      color: #fff;
      padding: 20px;
    }

    header img {
      width: 90px;
      height: auto;
    }

    form {
      background-color: #fff;
      width: 300px;
      margin: 60px auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .otp-input {
      width: 35px;
      height: 40px;
      margin: 5px;
      text-align: center;
      font-size: 18px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #0d6efd;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
      width: 100%;
      cursor: pointer;
    }

    a {
      color: #0d6efd;
      font-size: 14px;
      text-decoration: none;
      display: block;
      margin-top: 10px;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <img src="../Image/image.png" alt="لوگوی کافی‌نت NetAviz">
    <h2>کافی‌نت NetAviz</h2>
  </header>

  <form>
    <p>کد تأیید ارسال‌شده را وارد کنید:</p>
    <div>
      <input type="text" maxlength="1" class="otp-input">
      <input type="text" maxlength="1" class="otp-input">
      <input type="text" maxlength="1" class="otp-input">
      <input type="text" maxlength="1" class="otp-input">
    </div>
    <button type="submit">تأیید</button>
    <a href="#">ارسال مجدد کد</a>
  </form>
</body>
</html>
