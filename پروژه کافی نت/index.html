<style>
/* فونت Morabba-Medium */
@font-face {
  font-family: 'Morabba-Medium';
  src: url('Font/Morabba-Medium.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

body {
  font-family: 'Morabba-Medium', Tahoma, sans-serif;
  margin:0; padding:0;
  direction: rtl;
  background:#f9f9f9;
}

/* هدر */
header {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 15px 40px;
  background:#007bff;
  color:white;
}

/* لوگو سمت راست */
header img {
  position: absolute;
  height:50px;
  right: 20px;
}

/* منو وسط هدر */
header nav ul {
  display: flex;
  justify-content: center; /* وسط چین کردن لینک‌ها */
  gap: 40px;               /* فاصله بین لینک‌ها */
  list-style: none;
  padding: 0;
  margin: 0;
}

header nav ul li a {
  color:white;
  text-decoration:none;
  font-weight:bold;
  padding:5px 0;
}

header nav ul li a:hover {
  text-decoration: underline;
}

h1 {
  text-align:center;
  margin-top:50px;
  color:#333;
}

.hero {
  text-align:center;
  margin:30px auto;
  font-size:1.3em;
  color:#555;
}

.btn {
  background:#007bff;
  color:white;
  padding:12px 25px;
  border-radius:8px;
  text-decoration:none;
  display:inline-block;
  margin-top:40px;
}

.footer {
  background:#007bff;
  color:white;
  text-align:center;
  padding:15px;
  margin-top:50px;
}
</style>
</head>
