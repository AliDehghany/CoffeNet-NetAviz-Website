body { font-family: 'Morabba-Medium', Tahoma, sans-serif; margin:0; padding:0; direction: rtl; background:#f9f9f9; }
header { background:#0056b3; color:white; padding:15px 20px; display:flex; align-items:center; justify-content:space-between;}
header img { height:50px; }
nav a { color:white; text-decoration:none; margin:0 15px; font-weight:bold; }

.service-card { width:160px; height:120px; margin:10px; border-radius:12px; background:#d0e4ff; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition: all 0.3s ease; text-align:center;}

.next-btn.active { opacity:1; pointer-events:auto; }

/* ✅ اضافه‌شده برای انتخاب کارت */

  background: #007bff;
  color: #fff;
  transform: scale(1.05);
  box-shadow: 0 0 10px rgba(0, 123, 255, 0.4);

<style>
@font-face {
  font-family: "Morabba-Medium";
  src: url("fonts/Morabba-Medium.ttf") format("truetype");
}

body {
  font-family: "Morabba-Medium", Tahoma, sans-serif;
  margin:0;
  padding:0;
  direction: rtl;
}

header {
  display: flex;
  align-items: center;
  justify-content: center; /* ابتدا همه وسط */
  position: relative;
  padding: 15px 40px;
  background:#007bff;
}

/* منو وسط هدر */
.center-nav {
  display: flex;
  gap: 40px; /* فاصله بین لینک‌ها */
  position: absolute;
  left: 50%;
  transform: translateX(-50%); /* وسط هدر */
}

.center-nav a {
  color:white;
  text-decoration:none;
  font-weight:bold;
  padding:5px 0;
}

.center-nav a:hover {
  text-decoration: underline;
}

/* لوگو سمت راست */
header .logo {
  height: 50px;
  margin-left: auto; /* برای قرار گرفتن سمت راست */
}
</style>

<h2>مرحله ۱: انتخاب نوع خدمت</h2>
<div class="services-grid">
<div class="service-card" data-service="چاپ و پرینت">چاپ و پرینت</div>
<div class="service-card" data-service="اسکن">اسکن</div>
<div class="service-card" data-service="تایپ">تایپ</div>
<div class="service-card" data-service="ترجمه">ترجمه</div>
<div class="service-card" data-service="ثبت‌نام اینترنتی">ثبت‌نام اینترنتی</div>
</div>

<a href="step2.html" class="next-btn" id="nextBtn">مرحله بعد</a>

<script>
const cards = document.querySelectorAll('.service-card');
const nextBtn = document.getElementById('nextBtn');
let selectedService = localStorage.getItem('serviceType') || '';

cards.forEach(card => {
    if(card.dataset.service === selectedService) card.classList.add('active');
    card.addEventListener('click', () => {
        cards.forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        selectedService = card.dataset.service;
        localStorage.setItem('serviceType', selectedService);
        nextBtn.classList.add('active');
    });
});

if(selectedService) nextBtn.classList.add('active');
</script>

</body>
