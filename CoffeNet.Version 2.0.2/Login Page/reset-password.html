<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازیابی رمز عبور | کافی‌نت NetAviz</title>
  <style>
    @font-face {
      font-family: "Morabba";
      src: url("../Font/Morabba-Medium.ttf") format("truetype");
    }

    body {
      font-family: "Morabba", sans-serif;
      direction: rtl;
      background-color: #f6f7fb;
      text-align: center;
    }

    header {
      background-color: #0d6efd;
      color: #fff;
      padding: 20px;
    }

    header img {
      width: 90px;
      height: auto;
    }

    form {
      background-color: #fff;
      width: 320px;
      margin: 60px auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      text-align: right;
    }

    label {
      display: block;
      font-size: 14px;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #0d6efd;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
      width: 100%;
      cursor: pointer;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 10px;
      color: #0d6efd;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <img src="../Image/image.png" alt="لوگوی کافی‌نت NetAviz">
    <h2>کافی‌نت NetAviz</h2>
  </header>

  <form>
    <label for="new-pass">رمز عبور جدید:</label>
    <input type="password" id="new-pass" name="new-pass" required>

    <label for="confirm-pass">تکرار رمز عبور جدید:</label>
    <input type="password" id="confirm-pass" name="confirm-pass" required>

    <button class="btn-primary-filled">ذخیره رمز جدید</button>
    <a href="login.html" class="btn-primary-fillerd">بازگشت به صفحه ورود</a>
  </form>

  <footer class="footer">
    <div class="footer-container">
        <div class="footer-info">
            <h3>کافی‌نت نت‌آویز</h3>
            <p>آدرس:بهارستان،خیابان الفت‌شرقی،چهارراه آزادی، بازاچه فیروزه، کافی‌نت نت آویز</p>
            <p>تلفن: ۰۲۱-۱۲۳۴۵۶۷۸</p>
            <p>ایمیل: coffenetaviz@gmail.com</p>
        </div>
        <div class="footer-links">
            <h3>لینک‌های سریع</h3>
            <ul>
                <li><a href="index.html" class="btn-primary-fillerd">خانه</a></li>
                <li><a href="Place An Order/Step1.html" class="btn-primary-fillerd">سفارش چاپ</a></li>
                <li><a href="About & Contact/contact.html" class="btn-primary-fillerd">تماس با ما</a></li>
                <li><a href="About & Contact/about.html" class="btn-primary-fillerd">درباره ما</a></li>
            </ul>
        </div>
    </div>
    <div class="footer-bottom">
        <p>© 2025 کافی‌نت نت‌آویز؛ همه حقوق محفوظ است.</p>
    </div>
  </footer>
</body>
</html>
