<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مرحله ۳: انتخاب روش تحویل</title>
<style>
@font-face {
    font-family: 'Morabba-Medium';
    src: url(Morabba-Medium.ttf) format('truetype'); /* مسیر فایل فونت نسبت به HTML */
    font-weight: normal;
    font-style: normal;
}

body { font-family: 'Morabba-Medium', Tahoma, sans-serif; margin:0; padding:0; direction: rtl; background:#f9f9f9; }
header { background:#0056b3; color:white; padding:15px 20px; display:flex; align-items:center; justify-content:space-between;}
header img { height:50px; }
nav a { color:white; text-decoration:none; margin:0 15px; font-weight:bold; }
nav a:hover { text-decoration:underline; }
h2 { text-align:center; margin-top:30px; color:#333; }
.step { max-width:700px; margin:20px auto; padding:20px; background:#fff; border-radius:12px; box-shadow:0 0 15px rgba(0,0,0,0.1);}
.delivery-options { display:flex; justify-content:space-around; flex-wrap:wrap; margin-top:20px; }
.delivery-card { width:180px; padding:15px; margin:10px; border-radius:12px; text-align:center; cursor:pointer; transition: all 0.3s ease; box-shadow:0 0 5px rgba(0,0,0,0.1); color:white; }
/* افکت hover */
.delivery-card:hover { box-shadow:0 0 15px rgba(0,0,0,0.3); transform: scale(1.03); }
/* رنگ اصلی کارت‌ها */
.delivery-1 { background:#ff9800; } /* حضوری */
.delivery-2 { background:#0056b3; } /* دیجیتال */
.delivery-3 { background:#00bfa5; } /* پیک */
/* ✅ کلاس فعال */
.delivery-card.active { box-shadow:0 0 20px rgba(0,0,0,0.4); transform: scale(1.05); color:white; }
/* پس‌زمینه کمی تیره‌تر وقتی انتخاب میشه */
.delivery-card.active.delivery-1 { background:#e68900; }
.delivery-card.active.delivery-2 { background:#0056b3; }
.delivery-card.active.delivery-3 { background:#00a090; }

.next-btn { display:block; margin:30px auto; padding:12px 25px; background:#0056b3; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer; text-decoration:none; text-align:center; width:200px; opacity:0.6; pointer-events:none; }
.next-btn.active { opacity:1; pointer-events:auto; }
</style>
</head>
<body>

<header>
  <img src="image.png" alt="لوگو">
  <nav>
    <a href="index.html">خانه</a>
    <a href="step1.html">ثبت سفارش خدمات</a>
    <a href="contact.html">تماس با ما</a>
    <a href="about.html" class="active">درباره ما</a>
  </nav>
</header>

<style>
header {
  background:#0056b3;
  color:white;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:center; /* منو وسط */
  gap:50px; /* فاصله بین لوگو و لینک‌ها */
}

body {
  font-family: "Morabba-Medium", Tahoma, sans-serif;
  margin:0;
  padding:0;
  direction: rtl;
}

header {
  display: flex;
  align-items: center;
  justify-content: center; /* ابتدا همه وسط */
  position: relative;
  padding: 15px 40px;
  background:#007bff;
}

/* منو وسط هدر */
.center-nav {
  display: flex;
  gap: 40px; /* فاصله بین لینک‌ها */
  position: absolute;
  left: 50%;
  transform: translateX(-50%); /* وسط هدر */
}

.center-nav a {
  color:white;
  text-decoration:none;
  font-weight:bold;
  padding:5px 0;
}

.center-nav a:hover {
  text-decoration: underline;
}

/* لوگو سمت راست */
header .logo {
  height: 50px;
  margin-left: auto; /* برای قرار گرفتن سمت راست */
}
</style>

<h2>مرحله ۳: انتخاب روش تحویل</h2>
<div class="step delivery-options">
<div class="delivery-card delivery-1" data-delivery="دریافت حضوری">🏠 دریافت حضوری</div>
<div class="delivery-card delivery-2" data-delivery="ارسال دیجیتال">✉️ ارسال دیجیتال</div>
<div class="delivery-card delivery-3" data-delivery="ارسال با پیک (برگه‌رسان)">🛵 ارسال با پیک (برگه‌رسان)</div>
</div>

<a href="step4.html" class="next-btn" id="nextBtn">مرحله بعد</a>

<script>
const cards = document.querySelectorAll('.delivery-card');
const nextBtn = document.getElementById('nextBtn');
let selectedDelivery = localStorage.getItem('deliveryMethod') || '';

cards.forEach(card => {
    if(card.dataset.delivery === selectedDelivery) card.classList.add('active');
    card.addEventListener('click', () => {
        cards.forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        selectedDelivery = card.dataset.delivery;
        localStorage.setItem('deliveryMethod', selectedDelivery);
        nextBtn.classList.add('active');
    });
});

if(selectedDelivery) nextBtn.classList.add('active');
</script>

</body>
</html>
