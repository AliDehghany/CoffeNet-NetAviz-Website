<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فراموشی رمز عبور | NetAviz</title>
  <link rel="stylesheet" href="Assets/css/style.css">
     <link rel="stylesheet" href="Assets/css/color.css"> 
  <style>
    @font-face {
      font-family: "Morabba-Medium";
      src: url('Assets/Fonts/Morabba-Medium.ttf'), format('truetype');
    }

    body {
      font-family: 'Morabba-Medium', sans-serif;
      background-color: #f2f2f2;
      direction: rtl;
      text-align: center;
      padding: 50px;
    }

    .container {
      background-color: #fff;
      max-width: 400px;
      margin: auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    img {
      width: 80px;
      margin-bottom: 15px;
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      text-align: right;
      color: #555;
      font-size: 14px;
    }

    input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }

    button {
      background-color: #007bff;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }

    .back {
      display: block;
      margin-top: 15px;
      color: #007bff;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="Assets/Image/image.png" alt="NetAviz Logo">
    <h2>فراموشی رمز عبور</h2>
    <p>برای بازیابی رمز عبور، ایمیل یا شماره موبایل خود را وارد کنید تا کد تأیید برایتان ارسال شود.</p>

    <form action="otp.html" method="get">
      <label for="email">ایمیل یا شماره موبایل:</label>
      <input type="text" id="email" name="email" required>
      <button type="submit">ارسال کد تأیید</button>
    </form>

    <a href="login.html" class="back">بازگشت به صفحه ورود</a>
  </div>
</body>
</html>
